<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melissa Hallais — Voyages &amp; Images</title>
<meta name="description" content="Passeios a pé, de bike e com ensaio de fotos na Alsácia e Floresta Negra. Reserva online.">
<meta name="theme-color" content="#064c3f">
<meta property="og:type" content="website">
<meta property="og:title" content="Melissa Hallais — Voyages & Images">
<meta property="og:description" content="Reserve seu passeio em três toques. Marchés de Noël, Rota dos Vinhos, Estrasburgo, photo tours e bike — Alsácia e Floresta Negra.">
<meta property="og:image" content="https://eugeniofim.github.io/app-melissa/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://eugeniofim.github.io/app-melissa/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="tokens.css?v=1.9.2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23064c3f'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23d9aa0e' font-family='sans-serif' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<style>
/* ============ base ============ */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs-4);line-height:var(--lh-4);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:84px;resize:vertical}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--t-display);letter-spacing:var(--track-display)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.center{text-align:center}.right{text-align:right}.hide{display:none}
small{color:var(--ink-3)}

/* ============ toast / coach ============ */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;z-index:300;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--r-pill);font-size:var(--fs-3);box-shadow:var(--sh-2);transition:all var(--d-base) var(--ease);pointer-events:none;max-width:min(480px,92vw);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.coach{position:fixed;z-index:400;width:270px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:14px 16px;animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1}}
.coach-txt{font-size:var(--fs-3);line-height:1.5}
.coach-row{display:flex;align-items:center;gap:8px;margin-top:11px}
.coach-n{font-family:var(--f-mono);font-size:var(--fs-1);color:var(--ink-3);margin-left:auto}
.coach-next{background:var(--accent);color:var(--accent-ink);padding:6px 14px;border-radius:var(--r-pill);font-weight:var(--t-strong);font-size:var(--fs-3)}
.coach-skip{color:var(--ink-3);font-size:var(--fs-2)}
.coach-hi{outline:3px solid var(--highlight);outline-offset:3px;border-radius:var(--r);transition:outline var(--d-fast)}

/* ============ hub ============ */
.hub{position:relative;min-height:100vh;display:grid;place-items:center;padding:24px 16px 60px;overflow:hidden}
.hub-bg{position:absolute;inset:-4%;background-size:cover;background-position:center 40%}
.hub-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(165deg,rgba(6,30,24,.82),rgba(6,40,32,.72))}
.hub-in{position:relative;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.vcard{background:var(--surface);border-radius:var(--r-xl);padding:26px 22px 20px;text-align:center;box-shadow:var(--sh-3)}
.logo-mark{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--brand-verde);color:var(--brand-amarelo);font-family:var(--f-display);font-weight:700;font-size:28px}
.logo-mark.sm{width:34px;height:34px;font-size:16px;margin:0}
.vcard h1{font-size:var(--fs-7)}
.role{font-family:var(--f-mono);font-size:var(--fs-1);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--highlight-text);margin-top:6px}
.tagline{font-size:var(--fs-3);color:var(--ink-2);margin-top:10px}
.langs{display:flex;gap:5px}
.langs.center{justify-content:center;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.langs.right{margin-left:auto}
.langs button{padding:5px 11px;border-radius:var(--r-pill);font-size:var(--fs-2);font-weight:var(--t-strong);background:var(--surface-2);color:var(--ink-3)}
.langs button.on{background:var(--accent);color:var(--accent-ink)}
.lk{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1);text-align:left;transition:transform var(--d-fast) var(--spring),box-shadow var(--d-base)}
.lk:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.lk .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);flex:none;font-size:16px}
.lk b{display:block;font-size:var(--fs-4)}
.lk small{display:block;font-size:var(--fs-2)}
.lk .go{margin-left:auto;color:var(--ink-3)}
.lk.main{background:var(--brand-verde);color:#fff}
.lk.main small{color:rgba(255,255,255,.75)}
.lk.main .ic{background:rgba(255,255,255,.16)}
.lk.main .go{color:var(--brand-amarelo)}
.adm-entry{margin:6px auto 0;padding:8px 15px;border-radius:var(--r-pill);font-size:var(--fs-2);color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}
.adm-entry:hover{background:rgba(255,255,255,.22)}

/* ============ cliente ============ */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 18px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar b{font-family:var(--f-display);font-size:var(--fs-4)}
.backbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--sh-1);flex:none}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 80px}
.pageh{font-size:var(--fs-7);margin-bottom:14px}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .pageh{margin:0;flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{padding:7px 15px;border-radius:var(--r-pill);font-size:var(--fs-3);font-weight:var(--t-strong);background:var(--surface);box-shadow:var(--sh-1);color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tourcard{border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1);text-align:left;transition:transform var(--d-base) var(--spring),box-shadow var(--d-base)}
.tourcard:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.tourcard .ph{display:block;height:150px;background-size:cover;background-position:center}
.tourcard .bd{display:block;padding:13px 15px 15px}
.tourcard b{display:block;font-family:var(--f-display);font-size:var(--fs-5)}
.tourcard small{display:block;margin-top:3px}
.tourcard .pr{display:inline-block;margin-top:9px;font-weight:var(--t-strong);color:var(--accent);background:var(--accent-wash);padding:3px 10px;border-radius:var(--r-pill);font-size:var(--fs-3)}
.empty{color:var(--ink-3);padding:22px 0}
.emptybox{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:34px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--ink-2)}

.hero-sm{height:min(34vh,300px);background-size:cover;background-position:center 42%}
.two-col{display:grid;grid-template-columns:1fr 360px;gap:34px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr;gap:20px}}
.badge{display:inline-block;background:var(--ok-wash);color:var(--ok);font-size:var(--fs-2);font-weight:var(--t-strong);padding:4px 11px;border-radius:var(--r-pill);margin:14px 0 10px}
.desc{color:var(--ink-2);max-width:56ch;margin-bottom:12px}
.h3{font-size:var(--fs-5);margin:16px 0 5px}

/* reserva */
.book{position:sticky;top:74px;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:18px 20px 20px;margin-top:14px}
.bhead{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.bprice{font-family:var(--f-display);font-size:var(--fs-6);font-weight:700}
.bprice small{font-family:var(--f-ui);font-weight:400;font-size:var(--fs-3)}
.bstep{font-family:var(--f-mono);font-size:var(--fs-1);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dcell{border-radius:var(--r);background:var(--surface-2);padding:8px 4px;text-align:center;transition:all var(--d-fast)}
.dcell b{display:block;font-size:var(--fs-3)}
.dcell small{font-size:var(--fs-1);text-transform:uppercase}
.dcell.on{background:var(--accent);color:var(--accent-ink)}
.dcell.on small{color:rgba(255,255,255,.75)}
.hint{font-size:var(--fs-3);color:var(--ink-3);margin:12px 0 8px}
.times{display:flex;gap:8px;flex-wrap:wrap}
.slot{border-radius:var(--r);background:var(--surface-2);padding:9px 14px;font-weight:var(--t-strong)}
.slot small{display:block;font-weight:400;font-size:var(--fs-1)}
.slot.on{background:var(--accent);color:var(--accent-ink)}
.slot.on small{color:rgba(255,255,255,.75)}
.slot.off{opacity:.4;cursor:default}
.cta{display:block;width:100%;margin-top:16px;padding:14px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:var(--t-strong);font-size:var(--fs-4);transition:filter var(--d-fast),transform var(--d-fast) var(--spring)}
.cta:hover{filter:brightness(1.12);transform:translateY(-1px)}
.cta:disabled{opacity:.4;cursor:not-allowed;transform:none}
.cta.soft{background:var(--surface-2);color:var(--ink)}
.cta.sm{width:auto;margin:0;padding:9px 16px;font-size:var(--fs-3)}
.linkbtn{display:block;margin:10px auto 0;color:var(--ink-3);font-size:var(--fs-3)}
.linkbtn:hover{color:var(--ink)}
.paxrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.pm{display:flex;align-items:center;gap:12px}
.pm button{width:32px;height:32px;border-radius:50%;background:var(--surface-2);font-size:17px}
.pm span{min-width:22px;text-align:center;font-weight:var(--t-strong)}
.sums{margin-top:10px;font-size:var(--fs-3);color:var(--ink-2)}
.sums>div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.sums .tot{font-size:var(--fs-4);color:var(--ink);border-bottom:0}
.sums .tot b{font-family:var(--f-display);font-size:var(--fs-5)}
.coupon{margin-top:8px;font-size:var(--fs-3)}
.coupon summary{cursor:pointer;color:var(--ink-3)}
.crow{display:flex;gap:8px;margin-top:8px}
.cbad{color:var(--danger);font-size:var(--fs-2);margin-top:5px}
.fld{display:block;font-size:var(--fs-3);font-weight:var(--t-strong);margin-top:11px}
.fld input,.fld select,.fld textarea{margin-top:5px;font-weight:400}
.fld.chk{display:flex;align-items:center;gap:8px}
.fld.chk input{width:auto;margin:0}
.why{display:block;font-weight:400;margin-top:4px}
.payopts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.popt{text-align:left;border:1.5px solid var(--line);border-radius:var(--r);padding:11px 13px}
.popt small{display:block;font-weight:400;margin-top:3px;line-height:1.4}
.popt.on{border-color:var(--accent);background:var(--accent-wash)}
.fine{font-size:var(--fs-2);color:var(--ink-3);text-align:center;margin-top:9px}
.fine.demo{color:var(--highlight-text);background:var(--highlight-wash);border-radius:var(--r);padding:6px}
.okc{width:60px;height:60px;margin:6px auto 12px;border-radius:50%;background:var(--ok-wash);color:var(--ok);display:grid;place-items:center;font-size:26px;font-weight:700}
.okh{text-align:center;font-size:var(--fs-6)}
.voucher{margin-top:14px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:14px 16px;font-size:var(--fs-3)}
.voucher small{font-family:var(--f-mono);font-size:var(--fs-1);letter-spacing:var(--track-label);text-transform:uppercase}
.voucher .code{font-family:var(--f-mono);font-size:var(--fs-5);color:var(--accent);letter-spacing:.08em;margin:2px 0 8px}
.voucher .due{margin-top:8px;color:var(--highlight-text);background:var(--highlight-wash);border-radius:var(--r-sm);padding:6px 9px}
.okrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.mini{padding:7px 13px;border-radius:var(--r-pill);background:var(--surface-2);font-size:var(--fs-2);font-weight:var(--t-strong)}
.mini:hover{background:var(--surface-3)}
.mini.danger{color:var(--danger);background:var(--danger-wash)}
.mini.ghost{background:transparent;border:1px solid var(--line)}
.photopick{display:flex;gap:12px;align-items:flex-start;margin-top:6px}
.pprev{width:104px;height:66px;flex:none;border-radius:10px;background-size:cover;background-position:center;
  background-color:var(--surface-2);display:grid;place-items:center;border:1px dashed var(--line-2)}
.pprev i{font-style:normal;font-size:22px;color:var(--ink-3)}
.ppinfo{flex:1;min-width:0}
.ppinfo input[type=file]{font-size:12px;max-width:100%}
/* ---------- opt-in ---------- */
.optin{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:12px 13px;
  border-radius:var(--r);background:var(--surface-2);cursor:pointer}
.optin input{width:19px;height:19px;flex:none;margin-top:1px;accent-color:var(--accent);cursor:pointer}
.optin b{display:block;font-size:13px;font-weight:600;line-height:1.35}
.optin small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.optin:has(input:checked){background:var(--accent-wash)}
/* ---------- login ---------- */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,var(--accent) 0%,#03352b 100%)}
.logincard{width:min(400px,100%);background:var(--surface);border-radius:var(--r-lg,18px);
  padding:30px 26px 22px;box-shadow:var(--sh-3);text-align:left}
.loginlogo{display:flex;justify-content:center;margin-bottom:14px}
.logincard h1{font-family:var(--f-display);font-size:22px;font-weight:700;text-align:center;
  letter-spacing:-.02em;margin-bottom:6px}
.logincard .center{text-align:center}
.logincard .fld{margin-top:14px;display:block}
.logincard .cta{margin-top:18px;width:100%}
.logincard .linkbtn{display:block;width:100%;margin-top:12px;background:none;border:0;
  color:var(--accent);font:inherit;font-size:13.5px;cursor:pointer;padding:6px}
.logincard .fine{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--ink-3)}
@media (max-width:420px){.logincard{padding:24px 18px 18px}}
/* ---------- validação ---------- */
.fld input.invalid,.fld textarea.invalid{border-color:var(--danger);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--danger) 18%,transparent)}
.fld .err{display:block;color:var(--danger);font-size:12px;margin-top:5px;font-weight:500}

/* ---------- impressão do extrato (ela leva ao contador) ---------- */
@media print{
  @page{size:A4;margin:14mm}
  .rail,.mobar,.chips,.coach,.toast,.demobar,.railfoot,.pagehead .mini,.pagehead button{display:none!important}
  body{background:#fff!important}
  .adm{display:block!important}
  .stage{padding:0!important}
  .card{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid}
  .tbl{font-size:10pt!important;width:100%!important}
  .tbl thead{display:table-header-group}
  .tbl tr{break-inside:avoid}
  .pageh{font-size:18pt!important;margin:0 0 4mm!important}
  .pageh::after{content:" — Voyages & Images · Melissa Hallais";font-size:10pt;font-weight:400;color:#666}
}
/* ---------- foco e acessibilidade ---------- */
input:focus-visible,select:focus-visible,textarea:focus-visible,
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tourcard:focus-visible,.lk:focus-visible,.agc:focus-visible{outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  .tourcard,.lk,.cta,.mini,.chip,.agc{transition-property:transform,box-shadow,background,color,border-color}
}
/* ---------- vitrine: cards alinhados e com hierarquia ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 64px}
.tbrand{display:inline-flex;align-items:center;gap:9px;min-width:0}
.tbrand b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:18px;align-items:stretch}
.tourcard{display:flex;flex-direction:column;text-align:left;padding:0;border:0;cursor:pointer;
  background:var(--surface);border-radius:var(--r-lg,18px);overflow:hidden;box-shadow:var(--sh-1);
  font:inherit;color:var(--ink);height:100%;
  transition:transform .22s var(--ease,cubic-bezier(.22,1,.36,1)),box-shadow .22s}
.tourcard:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.tourcard:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tourcard .ph{display:block;position:relative;width:100%;aspect-ratio:16/10;background-size:cover;
  background-position:center;flex:none}
.tourcard .ph::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(6,32,26,.34),transparent 46%)}
.tbadge{position:absolute;left:10px;top:10px;z-index:2;font-family:var(--f-mono);font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.94);color:var(--accent);
  padding:5px 9px;border-radius:100px;font-weight:600}
.tourcard .bd{display:flex;flex-direction:column;gap:5px;padding:14px 16px 15px;flex:1}
.tourcard .bd b{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.25;
  letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.5em}
.tourcard .meta{font-size:12px;color:var(--ink-3)}
.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.tourcard .pr{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--accent)}
.tourcard .pr i{font-style:normal;font-family:var(--f-ui);font-weight:400;font-size:11.5px;color:var(--ink-3);
  display:block;margin-top:1px;letter-spacing:0}
.cgo{width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent-wash);color:var(--accent);
  display:grid;place-items:center;font-size:14px;transition:.2s}
.tourcard:hover .cgo{background:var(--accent);color:#fff;transform:translateX(2px)}
.pageh{margin:22px 0 14px}
@media (max-width:640px){
  .wrap{padding:0 14px 72px}
  .cards{grid-template-columns:1fr;gap:14px}
  .tourcard .ph{aspect-ratio:16/9}
  .pageh{font-size:24px;margin:16px 0 12px}
}
/* agenda */

/* =========================================================
   ABERTURA (splash)
   O colombage se desenha traço a traço enquanto gira em 3D.
   Ordem: as duas diagonais → as vigas → a travessa → a palavra.
   Dura 2,1s no total e sai sozinha. Quem já viu na sessão não vê de novo.
   ========================================================= */
.splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;
  background:var(--brand-verde);
  /* leve profundidade: um halo quente atrás da marca */
  background-image:radial-gradient(120% 80% at 50% 38%, #0a6957 0%, #064c3f 46%, #043a30 100%);
  perspective:1100px;perspective-origin:50% 42%;
  animation:spOut 620ms var(--ease) 2100ms forwards}
.splash.gone{display:none}

.sp-stage{text-align:center;transform-style:preserve-3d;
  animation:spTilt 2000ms var(--ease) both}

/* --- símbolo: gira em 3D e se desenha --- */
.sp-mark{transform-style:preserve-3d;animation:spMark 1500ms var(--ease) both}
.sp-mark svg{filter:drop-shadow(0 18px 40px rgba(0,0,0,.45))}
.s-p{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:spDraw 620ms var(--ease) both}
.s-x1{--len:340;animation-delay:180ms}
.s-x2{--len:340;animation-delay:300ms}
.s-v1{--len:500;animation-delay:520ms}
.s-v2{--len:500;animation-delay:600ms}
.s-h {--len:260;animation-delay:820ms}

/* --- palavra e assinatura --- */
.sp-word,.sp-role,.sp-region,.sp-lang{color:#fff;animation:spUp 700ms var(--ease) both}
.sp-word{margin-top:26px;font-family:var(--f-display);font-weight:800;
  font-size:clamp(26px,7.4vw,40px);line-height:1.03;letter-spacing:-.01em;animation-delay:1020ms}
.sp-role{margin-top:14px;font-family:var(--f-display);font-weight:700;
  font-size:clamp(10px,2.7vw,12px);letter-spacing:.2em;color:rgba(255,255,255,.94);animation-delay:1220ms}
.sp-region{margin-top:5px;font-family:var(--f-ui);font-size:clamp(9.5px,2.5vw,11px);
  letter-spacing:.19em;color:rgba(255,255,255,.7);animation-delay:1340ms}
.sp-region i,.sp-lang i{font-style:normal;color:var(--brand-amarelo);margin:0 5px}
.sp-lang{margin-top:20px;font-family:var(--f-display);font-weight:700;
  font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.6);animation-delay:1500ms}

@keyframes spDraw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
/* a marca chega de perfil e assenta de frente */
@keyframes spMark{
  0%  {transform:perspective(1100px) rotateY(-72deg) rotateX(12deg) translateZ(-120px) scale(.86);opacity:0}
  38% {opacity:1}
  100%{transform:perspective(1100px) rotateY(0) rotateX(0) translateZ(0) scale(1);opacity:1}}
/* o conjunto todo respira um grau para trás — dá o volume sem enjoar */
@keyframes spTilt{
  0%  {transform:rotateX(9deg) translateY(14px)}
  100%{transform:rotateX(0) translateY(0)}}
@keyframes spUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}

/* Quem pediu menos movimento vê a marca parada, e por menos tempo. */
@media (prefers-reduced-motion:reduce){
  .splash{animation:spOut 300ms linear 900ms forwards}
  .sp-stage,.sp-mark,.sp-word,.sp-role,.sp-region,.sp-lang{animation:none}
  .s-p{stroke-dashoffset:0;animation:none}
}
